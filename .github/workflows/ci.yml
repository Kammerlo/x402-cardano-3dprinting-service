name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: print_test
          POSTGRES_PASSWORD: print_test
          POSTGRES_DB: print_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U print_test -d print_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://print_test:print_test@localhost:5432/print_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate production web image
        run: |
          docker build -f Dockerfile.web -t print-web-test .
          docker run --rm --add-host api:127.0.0.1 print-web-test nginx -t

      - name: Validate standalone gateway deployment
        run: |
          cp .env.gateway.example .env.gateway
          docker compose -f docker-compose.gateway.yml config --quiet
          docker build -f Dockerfile.gateway -t print-gateway-test .
          docker run --rm --read-only --tmpfs /tmp:size=64m,mode=1777 --tmpfs /data --cap-drop ALL --security-opt no-new-privileges:true print-gateway-test node --import tsx --input-type=module -e 'import { durableWrite } from "./apps/gateway/src/journal.ts"; import { availablePlates } from "./apps/gateway/src/plates.ts"; await durableWrite("/data/smoke.json", "{}"); console.log("Gateway journal writable; TS loader ready", await availablePlates("/data"));'
