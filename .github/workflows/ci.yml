name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: print_test
          POSTGRES_PASSWORD: print_test
          POSTGRES_DB: print_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U print_test -d print_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://print_test:print_test@localhost:5432/print_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
