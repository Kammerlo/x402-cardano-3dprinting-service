# Per-client limit for login attempts. Set real_ip only for your trusted proxy
# if it supplies client addresses; never trust arbitrary forwarded headers.
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 16k;
  large_client_header_buffers 4 96k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  location = /api/admin/auth/login {
    limit_req zone=admin_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8787;
  }
  location /api/ {
    proxy_pass http://api:8787;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffer_size 96k;
    proxy_buffers 4 96k;
    proxy_busy_buffers_size 192k;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
