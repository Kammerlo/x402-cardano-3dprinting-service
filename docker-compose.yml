# Real preprod/mainnet payments and a real printer. Copy .env.local.example to .env first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: print
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: print
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print -d print"]
      interval: 3s
      retries: 15
  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        for f in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h db -U print -d print -f "$$f"; done
  api:
    build: .
    command: npm run start -w @print/api
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      NODE_OPTIONS: --max-http-header-size=98304
      LOCAL_DATABASE_URL: postgresql://print:${POSTGRES_PASSWORD}@db:5432/print
      CARDANO_NETWORK: ${CARDANO_NETWORK:?Set CARDANO_NETWORK}
      FACILITATOR_URL: ${FACILITATOR_URL:?Set FACILITATOR_URL}
      SELLER_ADDRESS: ${SELLER_ADDRESS:?Set SELLER_ADDRESS}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PRICE_LOVELACE: ${PRICE_LOVELACE:-5000000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set GATEWAY_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    ports:
      - "127.0.0.1:8787:8787"
  gateway:
    build: .
    command: npm run start -w @print/gateway
    restart: unless-stopped
    environment:
      API_URL: http://api:8787
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      MOONRAKER_URL: ${MOONRAKER_URL:?Set MOONRAKER_URL reachable from Docker}
      MOONRAKER_API_KEY: ${MOONRAKER_API_KEY:-}
      ARM_ONCE: "false"
      PRINTS_DIR: /prints
      STATE_DIR: /data
    volumes:
      - ./prints:/prints:ro
      - gateway_data:/data
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BLOCKFROST_MAINNET_PROJECT_ID: ${VITE_BLOCKFROST_MAINNET_PROJECT_ID:-}
        VITE_BLOCKFROST_PREPROD_PROJECT_ID: ${VITE_BLOCKFROST_PREPROD_PROJECT_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

volumes:
  db_data:
  gateway_data:
